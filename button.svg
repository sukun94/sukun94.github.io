<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52">
  <defs>
    <!-- Dark blue background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Orange accent gradient (replaces green/blue) -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Stronger drop shadow -->
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <!-- New cloud-with-arrow icon -->
    <g id="cloudDownload">
      <path d="M18,10c-2.2,0-4,1.8-4,4c0,0.8,0.2,1.5,0.6,2.1c-0.8,0.4-1.6,1.1-1.6,2.1c0,1.2,1,2.2,2.2,2.2h10.6c1.2,0,2.2-1,2.2-2.2c0-0.9-0.6-1.7-1.5-2c0.4-0.6,0.6-1.3,0.6-2.1c0-2.2-1.8-4-4-4c-0.5,0-1,0.1-1.5,0.3C20.2,10.5,19.1,10,18,10z" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="18" y1="18" x2="18" y2="28" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <polyline points="13,23 18,28 23,23" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Button body -->
  <rect x="2" y="2" width="256" height="48" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>

  <!-- Top accent stripe (instead of left) -->
  <rect x="2" y="2" width="256" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Icon (cloud) on the left -->
  <use href="#cloudDownload" x="14" y="8" transform="scale(0.9) translate(5,5)"/>

  <!-- Vertical dotted divider -->
  <line x1="50" y1="12" x2="50" y2="40" stroke="#334155" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Context label (new) -->
  <text x="60" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#94a3b8" letter-spacing="1">[NAME]</text>

  <!-- Main label – unchanged text -->
  <text x="60" y="40" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="url(#accentGrad)" letter-spacing="0.5">Download Latest</text>

  <!-- Decorative dot on the right -->
  <circle cx="236" cy="26" r="4" fill="url(#accentGrad)" opacity="0.5"/>
</svg>